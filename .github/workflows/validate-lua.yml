name: Validate Lua

on:
  push:
  pull_request:

jobs:
  validate_lua:
    name: Validate Lua syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Validate Lua syntax
        run: |
          exit_code=0

          while IFS= read -r -d '' file; do
            echo "Checking $file..."
            if ! luac5.1 -p "$file"; then
              exit_code=1
            fi
          done < <(git ls-files -z '*.lua')

          exit $exit_code
