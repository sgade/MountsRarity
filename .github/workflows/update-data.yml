name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'

jobs:
  update_mountrarities:
    name: Update Data.lua
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          fetch-tags: true

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Update rarities
        run: ./scripts/update-rarities.sh

      - name: Verify Data.lua was updated
        id: verify-changes
        uses: tj-actions/verify-changed-files@v16
        with:
          files: |
            MountsRarity.lua

      - name: Set minor version and last-updated timestamp
        if: steps.verify-changes.outputs.files_changed == 'true'
        run: |
          NOW_EPOCH=$(date -u +%s)
          NEXT_MINOR=$(date -u -d "@$NOW_EPOCH" +%Y%m%d%H%M)
          sed -i "s/MINOR[[:space:]]*=[[:space:]]*[[:digit:]]\+/MINOR = $NEXT_MINOR/" MountsRarity.lua
          sed -i "s/LAST_UPDATED[[:space:]]*=[[:space:]]*[[:digit:]]\+/LAST_UPDATED = $NOW_EPOCH/" MountsRarity.lua

      - name: Define release tag
        if: steps.verify-changes.outputs.files_changed == 'true'
        id: define-release-tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ""
          dry_run: true

      - name: Commit version change
        if: steps.verify-changes.outputs.files_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(data): update rarity data"
          tagging_message: ${{ steps.define-release-tag.outputs.new_tag }}
