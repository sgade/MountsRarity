name: Update data

on:
  workflow_dispatch:
  schedule:
    # dataforazeroth.com publishes new rarity data before 00:45 UTC on Thursday and Sunday.
    - cron: '47 2 * * 0,4'

permissions:
  contents: read

jobs:
  update_data:
    name: Update rarity data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          fetch-tags: true

      # mise builds Lua 5.1 from source, and that build needs the readline headers.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Install tools
        uses: jdx/mise-action@v5
        with:
          install_args: jq lua

      - name: Update rarities
        run: ./scripts/update-rarities.sh

      - name: Verify MountsRarity.lua was updated
        id: verify-changes
        uses: tj-actions/verify-changed-files@v20
        with:
          files: |
            MountsRarity.lua

      - name: Commit rarity data change
        if: steps.verify-changes.outputs.files_changed == 'true'
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(data): update rarity data"
          file_pattern: MountsRarity.lua

      - name: Define release tag
        if: steps.commit.outputs.changes_detected == 'true'
        id: define-release-tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ""
          dry_run: true
          commit_sha: ${{ steps.commit.outputs.commit_hash }}

      - name: Push release tag
        if: steps.commit.outputs.changes_detected == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          create_git_tag_only: true
          tagging_message: ${{ steps.define-release-tag.outputs.new_tag }}
